[profile.default]
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
fail-fast = false
retries = 0
slow-timeout = { period = "20s", terminate-after = 2 }

[test-groups]
shell-guardian = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(process_behavior) | binary(runtime_behavior) | binary(tool_behavior)"
test-group = "shell-guardian"

[[profile.default.overrides]]
filter = "test(authenticate_tool_reports_unwired_oauth_flow_without_success_claim)"
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
filter = "test(mcp_manager_auth_action_shows_status_on_oauth_failure)"
slow-timeout = { period = "30s", terminate-after = 3 }

# Writes 10_000 journal records (each synced) and paginates all of them;
# on slow filesystems this takes well over the default 40s budget.
[[profile.default.overrides]]
filter = "test(child_pages_cover_thousand_and_ten_thousand_rows_with_stable_cursor)"
slow-timeout = { period = "45s", terminate-after = 3 }

# Captures 12 MiB of bash output; the complete-output store performs a
# durable index write per 8 KiB chunk, so the flood legitimately takes
# tens of seconds on fsync-bound disks.
[[profile.default.overrides]]
filter = "test(complete_agent_output_survives_preview_queue_pressure)"
slow-timeout = { period = "45s", terminate-after = 3 }

[profile.ci]
inherits = "default"
status-level = "all"
final-status-level = "all"
slow-timeout = { period = "30s", terminate-after = 2 }

# Same 12 MiB capture test as in profile.default: the complete-output store
# writes a durable index per 8 KiB chunk, so the flood takes tens of seconds.
[[profile.ci.overrides]]
filter = "test(complete_agent_output_survives_preview_queue_pressure)"
slow-timeout = { period = "45s", terminate-after = 3 }

[profile.slow]
inherits = "default"
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 3 }
