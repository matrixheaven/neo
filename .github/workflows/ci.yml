name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  ci:
    name: cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Reject complexity lint exemptions
        run: |
          if git grep -n -E 'clippy::(too_many_lines|too_many_arguments)' -- crates; then
            echo "Local complexity lint exemptions are not allowed"
            exit 1
          fi

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D clippy::all -A clippy::pedantic

      - name: Run tests
        run: cargo nextest run --workspace --all-features --profile ci
